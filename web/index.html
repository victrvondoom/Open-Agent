<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <script>try { const t = localStorage.getItem("pp-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
  <title>RECLAIM × Open-Agent — Evidence-Verified Dispute Resolution OS</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="logo" aria-hidden="true">⚖</span>
    <div>
      <div class="name">RECLAIM <span class="dim">×</span> Open-Agent</div>
      <div class="sub">Evidence-Verified Dispute Resolution OS · Multi-Agent Regulatory &amp; Financial Defense</div>
    </div>
  </div>
  <div class="top-right">
    <div class="domain-tabs">
      <button id="tab-all" class="tab-btn active" data-domain="all">All Disputes</button>
      <button id="tab-consumer" class="tab-btn" data-domain="consumer">Consumer Legal (RECLAIM)</button>
      <button id="tab-payroll" class="tab-btn" data-domain="payroll">Commission &amp; Payroll (PayProof)</button>
    </div>
    <div id="integrations" class="chips"></div>
    <label class="user">Acting as
      <select id="user"></select>
    </label>
    <button id="new-case" class="primary" title="File a new dispute; the multi-agent verifier runs on it">+ New Investigation</button>
    <button id="bench" class="ghost" title="Benchmark results &amp; accuracy evaluation">Benchmark &amp; Eval</button>
    <button id="audit-btn" class="ghost" title="Inspect append-only cryptographic audit chain">Audit Trail</button>
    <button id="reset" class="ghost" title="Clear actions, ledger and injected events">Reset demo</button>
    <button id="theme" class="ghost icon" aria-label="Toggle light / dark theme">☾</button>
  </div>
</header>
<div class="layout">
  <aside class="queue">
    <div class="queue-head"><h2>Dispute Queue</h2><span id="qcount" class="dim"></span></div>
    <div class="queue-search-box">
      <input type="text" id="qsearch" placeholder="Search dispute, party, or law…">
    </div>
    <div id="queue"></div>
  </aside>
  <main id="main">
    <div class="empty">Select a dispute case from the queue to inspect evidence and run multi-agent verification.</div>
  </main>
</div>
<div id="drawer" class="drawer hidden">
  <div class="drawer-head"><h3 id="drawer-title"></h3><button id="drawer-close" class="ghost">✕</button></div>
  <div id="drawer-body"></div>
</div>
<div id="toast" class="toast hidden"></div>
<script src="app.js"></script>
</body>
</html>
